<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Alumni Link app icon</title>
  <desc id="desc">Rounded blue square with SBC alumni link lettering.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d6efd"/>
      <stop offset="55%" stop-color="#084298"/>
      <stop offset="100%" stop-color="#062a63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8ddcff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#061a3d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>

  <g filter="url(#shadow)">
    <circle cx="256" cy="194" r="112" fill="rgba(255,255,255,0.1)"/>
    <circle cx="256" cy="194" r="90" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="14"/>
    <path d="M256 102 281 161 344 166 296 207 311 268 256 236 201 268 216 207 168 166 231 161Z" fill="#ffffff" opacity="0.95"/>
    <circle cx="256" cy="194" r="20" fill="url(#accent)"/>
  </g>

  <text x="256" y="354" text-anchor="middle" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="4">SBC</text>
  <text x="256" y="404" text-anchor="middle" fill="rgba(255,255,255,0.84)" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="28" font-weight="700" letter-spacing="7">ALUMNI LINK</text>
</svg>
